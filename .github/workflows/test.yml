name: tests

# Runs the standalone Python test files, the official-SDK MCP integration suite,
# the demo check and the memory-challenge harness.
#
# The runtime depends on the official Model Context Protocol SDK, so the
# dependency is installed from pyproject.toml before the suites run.
# See docs/FOLLOWUP.md for deployment verification.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show interpreter and SQLite version
        run: |
          python -VV
          python -c "import sqlite3; print('sqlite', sqlite3.sqlite_version)"

      - name: Install the project and its dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -c "import mcp, importlib.metadata as md; print('mcp', md.version('mcp'))"

      - name: Byte-compile every module (syntax gate)
        run: python -m compileall -q . -x '__pycache__'

      - name: Acceptance suite (T1-T10)
        run: python tests/test_acceptance.py

      - name: Migration and compatibility suite
        run: python tests/test_migration.py

      - name: Memory architecture suite
        run: python tests/test_memory_architecture.py

      - name: MCP integration suite (official SDK client over stdio)
        run: python tests/test_mcp_integration.py
      - name: Identity binding
        run: python tests/test_trust_boundary.py
      - name: Owner token storage
        run: python tests/test_trust_token.py
      - name: Existence oracle
        run: python tests/test_existence_oracle.py
      - name: File permissions
        run: python tests/test_file_permissions.py
      - name: Provenance
        run: python tests/test_provenance.py
      - name: Injection framing
        run: python tests/test_injection_framing.py
      - name: Supersession
        run: python tests/test_supersession.py
      - name: Confused deputy
        run: python tests/test_confused_deputy.py
      - name: Resource limits
        run: python tests/test_resource_limits.py

      - name: Security suite
        run: python tests/test_security.py

      - name: quarantine review CLI
        run: python tests/test_quarantine_cli.py

      - name: chatgpt export parser
        run: python tests/test_chatgpt_ingest.py

      - name: hermes session ingest
        run: python tests/test_hermes_ingest.py

      - name: ingest canonical store
        run: python tests/test_ingest_store.py

      - name: ingest extract (local LM)
        run: python tests/test_ingest_extract.py

      - name: ingest reconcile (Layer 4)
        run: python tests/test_ingest_reconcile.py

      - name: import + packaging hygiene
        run: python tests/test_import_hygiene.py

      - name: backup + rotation
        run: python tests/test_backup_rotation.py

      - name: Demo transcript check (throwaway database)
        run: python demo/demo.py --tmp --check

      - name: MCP server advertises its tools through the SDK
        run: |
          python src/hungry_hippa/mcp_server.py --print-schemas > /tmp/schemas.json
          python - <<'PY'
          import json
          d = json.load(open("/tmp/schemas.json"))
          names = sorted(t["name"] for t in d["tools"])
          expected = ["hippa_build_context", "hippa_forget", "hippa_recall",
                      "hippa_record_outcome", "hippa_remember", "hippa_status"]
          assert names == expected, names
          blob = json.dumps(d).lower()
          assert "export" not in blob and "owner_token" not in blob, "leaked surface"
          print("tools:", names)
          PY

      - name: Memory challenge harness (regenerates results in a temp dir)
        env:
          # keep the harness inside the MCP call budget it documents
          HUNGRY_HIPPA_MAX_MCP_CALLS: "1000"
        run: python eval/check_results.py --verbose

      - name: Confirm no database, credential or token files are tracked
        run: |
          if git ls-files | grep -Ei '\.(db|sqlite|sqlite3|bak|key|pem)$|owner\.token$'; then
            echo "::error::tracked database or credential file"
            exit 1
          fi
          echo "no tracked database/credential files"
